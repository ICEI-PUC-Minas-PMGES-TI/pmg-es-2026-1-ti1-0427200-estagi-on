<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vagas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="container">

    <h1>VAGAS</h1>

    <!-- BUSCA -->
    <div class="topo">
        <input type="text" id="busca" placeholder="🔍 Buscar vagas">
    </div>

    <!-- CARDS -->
    <div class="cards-topo">
        <div class="card">Vagas salvas</div>
        <div class="card">Situação das vagas</div>
    </div>

    <div class="conteudo">

        <!-- FILTROS -->
        <div class="filtros">
            <h3>Filtros</h3>

            <label><input type="checkbox" value="TI"> TI</label>
            <label><input type="checkbox" value="RH"> RH</label>
            <label><input type="checkbox" value="Design"> Design</label>
            <label><input type="checkbox" value="Betim"> Betim</label>
            <label><input type="checkbox" value="Contagem"> Contagem</label>
            <label><input type="checkbox" value="Belo Horizonte"> Belo Horizonte</label>

            <button id="aplicar">Aplicar filtros</button>
            <button id="limpar" class="limpar">Limpar filtros</button>
        </div>

        <!-- LISTA -->
        <div class="lista" id="listaVagas">
            <h3>Lista de vagas</h3>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
