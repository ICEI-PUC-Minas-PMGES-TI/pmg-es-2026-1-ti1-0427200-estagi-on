<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estagi.ON - Dashboard Inicial</title>

    <link rel="stylesheet" href="./assets/css/global.css" />

    <style>
      .app-header {
        background-color: var(--color-surface);
        padding: var(--spacing-sm) var(--spacing-lg);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .app-header .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: -0.5px;
      }

      .app-header .logo img {
        height: 50px;
        width: auto;
      }

      .app-header .logo span {
        color: var(--color-text-main);
      }

      .navbar-links {
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .navbar-links a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--color-text-main);
        font-weight: 500;
        transition: color 0.2s ease;
        font-size: 1.1rem;
      }

      .navbar-links a:hover {
        color: var(--color-primary);
      }

      .navbar-links a .icon {
        font-size: 1.5rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--spacing-xl) var(--spacing-lg);
      }

      .page-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: var(--spacing-xs);
      }

      .page-subtitle {
        color: var(--color-text-light);
        margin-bottom: var(--spacing-xl);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--spacing-lg);
      }

      .module-card {
        background-color: var(--color-surface);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        box-shadow: var(--shadow-sm);
        border-top: 4px solid var(--color-primary);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 180px;
      }

      .module-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
        cursor: pointer;
      }

      .module-card h2 {
        font-size: 1.25rem;
        color: var(--color-text-main);
        margin-bottom: var(--spacing-xs);
        font-weight: 600;
      }

      .module-card p {
        color: var(--color-text-light);
        font-size: 0.95rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <img src="./assets/images/Logo.png" alt="Logo Estagi.ON" />
      </div>
      <nav class="navbar-links">
        <a href="./pages/login/index.html">
          <span class="icon">🔐</span>
          <span>Login</span>
        </a>
        <a href="./pages/mensagens/index.html">
          <span class="icon">💬</span>
          <span>Chat</span>
        </a>
        <a href="#">
          <span class="icon">👤</span>
          <span>Perfil</span>
        </a>
      </nav>
    </header>

    <main class="container">
      <h1 class="page-title">Bem-vindo(a) ao Dashboard</h1>
      <p class="page-subtitle">
        Acesso rápido aos módulos principais do sistema.
      </p>

      <div class="dashboard-grid">
        <a href="./pages/mural/index.html" class="module-card">
          <h2>Mural de Vagas</h2>
          <p>Explore e encontre as melhores oportunidades.</p>
        </a>

        <a href="#" class="module-card">
          <h2>Cadastrar Nova Vaga</h2>
          <p>Área para empresas publicarem novos estágios.</p>
        </a>
      </div>
    </main>
  </body>
</html>
