<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estagi.ON - Dashboard Inicial</title>

    <link rel="stylesheet" href="./assets/css/global.css" />

    <style>
      .app-header {
        background-color: var(--color-surface);
        padding: var(--spacing-sm) var(--spacing-lg);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .app-header .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: -0.5px;
      }

      .app-header .logo img {
        height: 50px;
        width: auto;
      }

      .app-header .logo span {
        color: var(--color-text-main);
      }

      .navbar-links {
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .navbar-links a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--color-text-main);
        font-weight: 500;
        transition: color 0.2s ease;
        font-size: 1.1rem;
      }

      .navbar-links a:hover {
        color: var(--color-primary);
      }

      .navbar-links a .icon {
        font-size: 1.5rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--spacing-xl) var(--spacing-lg);
      }

      .page-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: var(--spacing-xs);
      }

      .page-subtitle {
        color: var(--color-text-light);
        margin-bottom: var(--spacing-xl);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--spacing-lg);
      }

      .module-card {
        background-color: var(--color-surface);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        box-shadow: var(--shadow-sm);
        border-top: 4px solid var(--color-primary);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 180px;
      }

      .module-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
        cursor: pointer;
      }

      .module-card h2 {
        font-size: 1.25rem;
        color: var(--color-text-main);
        margin-bottom: var(--spacing-xs);
        font-weight: 600;
      }

      .module-card p {
        color: var(--color-text-light);
        font-size: 0.95rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
<div class="app-layout">
<aside class="sidebar">
    <div class="sb-logo">
        <img src="./assets/images/Logo.png" alt="Logo Estagi.ON" style="height: 50px; width: auto;" />
    </div>

    <nav class="sb-body">
        <div class="sb-section-label">Principal</div>

        <a href="./index.html" class="sb-item active">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
        </a>

        <a href="./pages/mensagens/index.html" class="sb-item ">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
        </a>

        <a href="./pages/calendario/index.html" class="sb-item">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <span class="sb-item-label">Calendário</span>
        </a>

        <a href="./pages/listagem-vagas/index.html" class="sb-item ">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><path d="M4 22V12a8 8 0 0 1 16 0v10"/><line x1="2" y1="22" x2="22" y2="22"/><path d="M10 22v-4a2 2 0 1 1 4 0v4"/></svg>
            </div>
            <span class="sb-item-label">Vagas</span>
        </a>

        <div class="sb-divider"></div>
        <div class="sb-section-label">Conta</div>

        <a href="#" class="sb-item">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
        </a>
    </nav>
    <a href="./pages/login/index.html" class="sb-footer">
        <div class="sb-user-av">AM</div>
        <div class="sb-user-info">
            <div class="sb-user-name">Ana Martins</div>
            <div class="sb-user-role">Aluna · USP</div>
        </div>
        <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </a>
</aside>
<div class="main-content">
<main class="container">
      <h1 class="page-title">Bem-vindo(a) ao Dashboard</h1>
      <p class="page-subtitle">
        Acesso rápido aos módulos principais do sistema.
      </p>

      <div class="dashboard-grid">
        <a href="./pages/listagem-vagas/index.html" class="module-card">
          <h2>Mural de Vagas</h2>
          <p>Explore e encontre as melhores oportunidades.</p>
        </a>

        <a href="#" class="module-card">
          <h2>Cadastrar Nova Vaga</h2>
          <p>Área para empresas publicarem novos estágios.</p>
        </a>
      </div>
    </main>
</div>
</div>
</body>
</html>
