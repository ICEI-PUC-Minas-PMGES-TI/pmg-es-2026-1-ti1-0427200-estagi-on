<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Vagas - Estagi.ON</title>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <script src="../../assets/js/login.js"></script>
    <style>
      .mural-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .vaga-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .vaga-card h2 {
        font-size: 1.05em;
        color: #093070;
        margin: 0;
      }
      .vaga-card .empresa {
        color: #ff7645;
        font-weight: bold;
        font-size: 0.9em;
      }
      .vaga-card .bolsa {
        color: #198754;
        font-weight: bold;
      }
      .vaga-card .meta {
        font-size: 0.85em;
        color: #666;
      }
      .vaga-card a {
        margin-top: auto;
        display: inline-block;
        background: #093070;
        color: #fff;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        text-align: center;
        font-size: 0.9em;
      }
      .vaga-card a:hover {
        background: #ff7645;
      }
      #loading {
        text-align: center;
        padding: 40px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <header
      style="
        background-color: #ffffff;
        padding: 1rem 2rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      "
    >
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="../../index.html" style="text-decoration: none">
          <img
            src="../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </a>
      </div>
      <nav style="display: flex; align-items: center; gap: 2rem">
        <a
          href="../../pages/login/index.html"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0f172a;
            font-weight: 500;
            text-decoration: none;
          "
          >🔐 Login</a
        >
        <a
          href="../../pages/mensagens/index.html"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0f172a;
            font-weight: 500;
            text-decoration: none;
          "
          >💬 Chat</a
        >
        <a
          href="#"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0f172a;
            font-weight: 500;
            text-decoration: none;
          "
          >👤 Perfil</a
        >
        <button
          onclick="window.history.back()"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0f172a;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
          "
        >
          ⬅ Voltar
        </button>
      </nav>
    </header>

    <main>
      <h3>Mural de Vagas</h3>
      <p>Clique em uma vaga para ver os detalhes e demonstrar interesse.</p>
      <div id="loading">Carregando vagas...</div>
      <div class="mural-grid" id="mural-grid"></div>
    </main>

    <script>
      fetch("/vagas")
        .then((res) => res.json())
        .then((vagas) => {
          document.getElementById("loading").style.display = "none";
          const grid = document.getElementById("mural-grid");
          vagas.forEach((vaga) => {
            grid.innerHTML += `
            <div class="vaga-card">
              <h2>${vaga.titulo}</h2>
              <div class="empresa">${vaga.empresa}</div>
              <div class="bolsa">R$ ${vaga.bolsa.toFixed(2)}/mês</div>
              <div class="meta">📍 ${vaga.local} &nbsp;|&nbsp; 🕐 ${vaga.cargaHoraria}</div>
              <a href="../detalhes-vaga/detalhes-vaga.html?id=${vaga.id}">Ver detalhes →</a>
            </div>`;
          });
        })
        .catch(() => {
          document.getElementById("loading").textContent =
            "Erro ao carregar vagas.";
        });
    </script>
  </body>
</html>
