<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Vagas - Estagi.ON</title>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <script src="../../assets/js/login.js"></script>
    <style>
      .mural-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .vaga-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .vaga-card h2 {
        font-size: 1.05em;
        color: #093070;
        margin: 0;
      }
      .vaga-card .empresa {
        color: #ff7645;
        font-weight: bold;
        font-size: 0.9em;
      }
      .vaga-card .bolsa {
        color: #198754;
        font-weight: bold;
      }
      .vaga-card .meta {
        font-size: 0.85em;
        color: #666;
      }
      .vaga-card a {
        margin-top: auto;
        display: inline-block;
        background: #093070;
        color: #fff;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        text-align: center;
        font-size: 0.9em;
      }
      .vaga-card a:hover {
        background: #ff7645;
      }
      #loading {
        text-align: center;
        padding: 40px;
        color: #888;
      }
    </style>
  </head>
  <body>
<div class="app-layout">
<aside class="sidebar">

        <img src="../../assets/images/Logo.png" alt="Logo Estagi.ON" style="height: 50px; width: auto;" />

    <nav class="sb-body">

        <a href="../../index.html" class="sb-item ">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
        </a>

        <a href="../../pages/mensagens/index.html" class="sb-item ">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
        </a>

        <a href="#" class="sb-item">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <span class="sb-item-label">Calendário</span>
        </a>

        <a href="../../pages/listagem-vagas/index.html" class="sb-item active">
            <div class="sb-item-icon">
                <svg viewBox="0 0 24 24"><path d="M4 22V12a8 8 0 0 1 16 0v10"/><line x1="2" y1="22" x2="22" y2="22"/><path d="M10 22v-4a2 2 0 1 1 4 0v4"/></svg>
            </div>
            <span class="sb-item-label">Vagas</span>

    <a href="../../pages/login/index.html" class="sb-footer">
        <div class="sb-user-av">AM</div>
        <div class="sb-user-info">
            <div class="sb-user-name">Ana Martins</div>
            <div class="sb-user-role">Aluna · USP</div>
        </div>
        <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

<div class="main-content">
<main>
      <h3>Mural de Vagas</h3>
      <p>Clique em uma vaga para ver os detalhes e demonstrar interesse.</p>
      <div id="loading">Carregando vagas...</div>
      <div class="mural-grid" id="mural-grid"></div>
    </main>

    <script>
      fetch("/vagas")
        .then((res) => res.json())
        .then((vagas) => {
          document.getElementById("loading").style.display = "none";
          const grid = document.getElementById("mural-grid");
          vagas.forEach((vaga) => {
            grid.innerHTML += `
            <div class="vaga-card">
              <h2>${vaga.titulo}</h2>
              <div class="empresa">${vaga.empresa}</div>
              <div class="bolsa">R$ ${vaga.bolsa.toFixed(2)}/mês</div>
              <div class="meta">📍 ${vaga.local} &nbsp;|&nbsp; 🕐 ${vaga.cargaHoraria}</div>
              <a href="../detalhes-vaga/detalhes-vaga.html?id=${vaga.id}">Ver detalhes →</a>
            </div>`;
          });
        })
        .catch(() => {
          document.getElementById("loading").textContent =
            "Erro ao carregar vagas.";
        });
    </script>
</div>
</div>
