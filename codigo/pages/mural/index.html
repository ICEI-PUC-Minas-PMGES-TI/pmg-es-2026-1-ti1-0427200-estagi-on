<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural de Vagas - Estagi.ON</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <script src="../../assets/js/login.js"></script>
  <style>
    .mural-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .vaga-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .vaga-card h2 { font-size: 1.05em; color: #093070; margin: 0; }
    .vaga-card .empresa { color: #ff7645; font-weight: bold; font-size: 0.9em; }
    .vaga-card .bolsa { color: #198754; font-weight: bold; }
    .vaga-card .meta { font-size: 0.85em; color: #666; }
    .vaga-card a {
      margin-top: auto;
      display: inline-block;
      background: #093070;
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9em;
    }
    .vaga-card a:hover { background: #ff7645; }
    #loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <header>
    <div class="banner"><img src="../../assets/images/banner_ti.png" alt="Estagi.ON" /></div>
    <div class="barra-info">
      <nav class="menu">
        <ul>
          <li><a href="../../index.html">Home</a></li>
          <li><a href="mural.html">Mural de Vagas</a></li>
          <li><a href="../../about.html">Sobre nós</a></li>
        </ul>
      </nav>
      <div class="dados-usuario"><span id="userInfo"></span></div>
    </div>
  </header>

  <main>
    <h3>Mural de Vagas</h3>
    <p>Clique em uma vaga para ver os detalhes e demonstrar interesse.</p>
    <div id="loading">Carregando vagas...</div>
    <div class="mural-grid" id="mural-grid"></div>
  </main>

  <script>
    fetch('/vagas')
      .then(res => res.json())
      .then(vagas => {
        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('mural-grid');
        vagas.forEach(vaga => {
          grid.innerHTML += `
            <div class="vaga-card">
              <h2>${vaga.titulo}</h2>
              <div class="empresa">${vaga.empresa}</div>
              <div class="bolsa">R$ ${vaga.bolsa.toFixed(2)}/mês</div>
              <div class="meta">📍 ${vaga.local} &nbsp;|&nbsp; 🕐 ${vaga.cargaHoraria}</div>
              <a href="../detalhes-vaga/detalhes-vaga.html?id=${vaga.id}">Ver detalhes →</a>
            </div>`;
        });
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'Erro ao carregar vagas.';
      });
  </script>
</body>
</html>
