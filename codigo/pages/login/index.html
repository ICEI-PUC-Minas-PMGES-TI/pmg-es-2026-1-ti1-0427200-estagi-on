<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Login | Estagi.ON</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../../assets/css/global.css">

<style>

.input-erro{

border:
1px solid #ef4444
!important;

box-shadow:
0 0 0 3px
rgba(239,68,68,.15);

}

.erro-texto{

display:block;

font-size:12px;

margin-top:6px;

color:#ef4444;

}

</style>

</head>


<body>


<div class="container">

<div
class="row
justify-content-center
mt-5">


<div class="col-md-5">

<form
id="login-form"
class="card p-4 shadow">

<h2 class="mb-4">
Entrar
</h2>



<div class="mb-3">

<label>
Login
</label>

<input

id="username"

class="form-control"

type="email">

</div>



<div class="mb-3">

<label>
Senha
</label>

<input

id="password"

class="form-control"

type="password">

</div>



<button
class="btn btn-primary">

Entrar

</button>


</form>

</div>

</div>

</div>



<script>

function erro(
input,
texto
){

limpar(input);

input.classList
.add(
"input-erro"
);

const span =
document.createElement(
"span"
);

span.className =
"erro-texto";

span.innerText =
texto;

input.parentElement
.appendChild(
span
);

}



function limpar(
input
){

input.classList
.remove(
"input-erro"
);

const e =
input.parentElement
.querySelector(
".erro-texto"
);

if(e)
e.remove();

}



document

.getElementById(
"login-form"
)

.addEventListener(

"submit",

e=>{

e.preventDefault();


const email =
document.getElementById(
"username"
);


const senha =
document.getElementById(
"password"
);


limpar(email);
limpar(senha);


let valido =
true;



if(

!/^[^\s@]+@[^\s@]+\.[^\s@]+$/

.test(

email.value

)

){

erro(

email,

"E-mail inválido"

);

valido=false;

}



if(

!/^(?=.*[A-Za-z])(?=.*\d).{6,}$/

.test(

senha.value

)

){

erro(

senha,

"Senha mínima: 6 caracteres + número"

);

valido=false;

}



if(valido){

processaFormLogin(
e
);

}


});

</script>


<script
src="../../assets/js/login.js">

</script>


</body>
</html>
