<!doctype html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Cadastro Empresa
</title>

<link
rel="stylesheet"
href="cadastro-empresas.css">


<style>

.input-erro{

border:
1px solid red
!important;

}


.erro-texto{

font-size:12px;

color:red;

display:block;

margin-top:5px;

}

</style>

</head>



<body
class="fundo-cadastro">


<div
class="cadastro-container">

<div
class="cadastro-card">


<form
id="form-empresa">


<div class="campo-grupo">

<label>

Razão Social

</label>

<input

id="razao-social"

class="campo-entrada">

</div>



<div class="campo-grupo">

<label>

CNPJ

</label>

<input

id="cnpj"

class="campo-entrada">

</div>



<div class="campo-grupo">

<label>

Email

</label>

<input

id="email"

class="campo-entrada">

</div>



<div class="campo-grupo">

<label>

Senha

</label>

<input

id="senha"

type="password"

class="campo-entrada">

</div>



<button
class="btn-cadastro-corporativo">

Cadastrar

</button>

</form>

</div>

</div>



<script>

function erro(
input,
texto
){

limpar(input);

input.classList.add(
"input-erro"
);


let span =
document.createElement(
"span"
);

span.className =
"erro-texto";

span.innerText =
texto;

input.parentElement
.appendChild(
span
);

}



function limpar(
input
){

input.classList.remove(
"input-erro"
);

const e =
input.parentElement
.querySelector(
".erro-texto"
);

if(e)
e.remove();

}



document

.getElementById(
"form-empresa"
)

.addEventListener(

"submit",

e=>{

e.preventDefault();


const nome =
document.getElementById(
"razao-social"
);


const cnpj =
document.getElementById(
"cnpj"
);


const email =
document.getElementById(
"email"
);


const senha =
document.getElementById(
"senha"
);



[nome,cnpj,email,senha]

.forEach(
limpar
);


let valido =
true;



if(
nome.value.length<3
){

erro(

nome,

"Nome inválido"

);

valido=false;

}



if(

!/\S+@\S+\.\S+/

.test(
email.value
)

){

erro(

email,

"E-mail inválido"

);

valido=false;

}



if(

cnpj.value
.replace(/\D/g,'')

.length!==14

){

erro(

cnpj,

"CNPJ inválido"

);

valido=false;

}



if(

!/^(?=.*[A-Za-z])(?=.*\d).{6,}$/

.test(

senha.value

)

){

erro(

senha,

"Senha fraca"

);

valido=false;

}



if(valido){

alert(
"Cadastro realizado"
);

}


});

</script>


</body>

</html>
