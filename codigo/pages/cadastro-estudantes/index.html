<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Estudante | Estagi.ON</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../login/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="../../assets/images/Logo.png" alt="Logo Estagi.ON" class="login-logo">
        <h1>Cadastro de Estudante</h1>
        <p>Crie sua conta no Estagi.ON e encontre seu estágio</p>
      </div>

      <form id="form-estudante">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" class="form-input" placeholder="Seu nome completo">
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="curso">Curso</label>
          <input type="text" id="curso" class="form-input" placeholder="Ex: Engenharia de Software">
        </div>

        <div class="form-group">
          <label for="instituicao">Instituição</label>
          <input type="text" id="instituicao" class="form-input" placeholder="Ex: PUC Minas">
        </div>

        <div class="form-group">
          <label for="semestre">Semestre atual</label>
          <input type="number" id="semestre" class="form-input" placeholder="Ex: 4" min="1" max="12">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-input" placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login">Cadastrar</button>
      </form>

      <div class="login-footer">
        <p>Já tem uma conta? <a href="../login/index.html">Entrar</a></p>
        <p>É uma empresa? <a href="../cadastro-empresas/index.html">Cadastre sua empresa</a></p>
      </div>
    </div>
  </div>

  <script src="./script.js" type="module"></script>
</body>
</html>
