<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>estagi.ON - Configurações</title>
    <link rel="stylesheet" href="/codigo/assets/css/sidebar.css" />
    <link rel="stylesheet" href="tela_configuracao.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sb-logo">
          <img
            src="./../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </div>

        <nav class="sb-body">
          <div class="sb-section-label">Principal</div>

          <a href="./../../index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
          </a>

          <a href="./../../pages/mensagens/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                />
              </svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
          </a>

          <a href="./../../pages/calendario/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>
            <span class="sb-item-label">Calendário</span>
          </a>

          <a href="./../../pages/listagem-vagas/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 22V12a8 8 0 0 1 16 0v10" />
                <line x1="2" y1="22" x2="22" y2="22" />
                <path d="M10 22v-4a2 2 0 1 1 4 0v4" />
              </svg>
            </div>
            <span class="sb-item-label">Vagas</span>
          </a>

          <div class="sb-divider"></div>
          <div class="sb-section-label">Conta</div>

          <a href="./../../pages/perfil/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
          </a>
        </nav>

        <a href="./../../pages/login/index.html" class="sb-footer">
          <div class="sb-user-av" id="sb-avatar">??</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="sb-nome">Visitante</div>
            <div class="sb-user-role" id="sb-tipo">---</div>
          </div>
          <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </div>
        </a>
      </aside>
      <main class="main-content">
        <div class="conteudo">
          <section class="topo">
            <h1>Configurações</h1>
            <p>Edite as informações principais do seu perfil.</p>
          </section>

          <section class="card">
            <div class="perfil">
              <img id="foto-preview" src="" alt="Foto do perfil" />
              <div>
                <h2 id="preview-nome">Usuário</h2>
                <p id="preview-email">email@email.com</p>
              </div>
            </div>

            <form id="form-configuracao">
              <div class="campo">
                <label for="foto">Foto</label>
                <input
                  type="text"
                  id="foto"
                  placeholder="Cole o link da foto"
                />
              </div>

              <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" />
              </div>

              <div class="campo">
                <label for="email">E-mail</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Digite seu e-mail"
                />
              </div>

              <div class="campo">
                <label for="email-confirmacao">Confirme seu e-mail</label>
                <input
                  type="email"
                  id="email-confirmacao"
                  placeholder="Digite seu e-mail"
                />
              </div>

              <button type="button" class="btn-secundario" id="verificar-email">
                Verificar e-mail
              </button>

              <div id="area-senha" style="display: none">
                <div class="campo">
                  <label for="nova-senha">Nova senha</label>
                  <input
                    type="password"
                    id="nova-senha"
                    placeholder="Digite a nova senha"
                  />
                </div>

                <div class="campo">
                  <label for="confirmar-senha">Confirmar nova senha</label>
                  <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme a nova senha"
                  />
                </div>

                <button type="button" class="btn-principal" id="salvar-senha">
                  Alterar senha
                </button>
              </div>

              <div class="botoes">
                <button type="button" class="btn-secundario" id="cancelar">
                  Cancelar
                </button>
                <button type="submit" class="btn-principal">
                  Salvar alterações
                </button>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>

    <div id="mensagem"></div>

    <script src="script.js"></script>
  </body>
</html>
