<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário – Estagi.ON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="calendario.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- BARRA LATERAL -->
      <aside class="sidebar">
        <div class="sb-logo">
          <img
            src="./../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </div>

        <nav class="sb-body">
          <div class="sb-section-label">Principal</div>

          <a href="./../../index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
          </a>

          <a href="./../../pages/mensagens/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
          </a>

          <a href="./../../pages/calendario/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>
            <span class="sb-item-label">Calendário</span>
          </a>

          <a href="./../../pages/listagem-vagas/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 22V12a8 8 0 0 1 16 0v10" />
                <line x1="2" y1="22" x2="22" y2="22" />
                <path d="M10 22v-4a2 2 0 1 1 4 0v4" />
              </svg>
            </div>
            <span class="sb-item-label">Vagas</span>
          </a>

          <div class="sb-divider"></div>
          <div class="sb-section-label">Conta</div>

          <a href="./../../pages/perfil/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
          </a>
        </nav>

        <a href="./../../pages/login/index.html" class="sb-footer">
          <div class="sb-user-av" id="sb-avatar">??</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="sb-nome">Visitante</div>
            <div class="sb-user-role" id="sb-tipo">---</div>
          </div>
          <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </div>
        </a>
      </aside>

      <div class="main-content">
        <header class="topo">
          <div class="topo-titulo">Calendário</div>

          <span class="topo-periodo" id="topo-periodo"></span>

          <div class="topo-espaco"></div>

          <button class="topo-novo-btn" id="btn-novo-evento">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Novo evento
          </button>
        </header>

        <!-- ÁREA PRINCIPAL DO CALENDÁRIO -->
        <main class="conteudo" id="conteudo"></main>
      </div>
    </div>

    <!-- MODAL – NOVO / EDITAR EVENTO -->
    <div class="modal-fundo" id="modal-fundo">
      <div class="modal">
        <div class="modal-cabecalho">
          <span class="modal-titulo" id="modal-titulo">Novo evento</span>
          <button class="modal-fechar" id="modal-fechar">✕</button>
        </div>
        <div class="modal-corpo">
          <div class="campo-grupo">
            <label class="campo-rotulo">Título *</label>
            <input
              class="campo-entrada"
              id="campo-titulo"
              type="text"
              placeholder="Ex: Entrevista TechSolutions"
            />
          </div>
          <div class="campo-linha">
            <div class="campo-grupo">
              <label class="campo-rotulo">Data</label>
              <input class="campo-entrada" id="campo-data" type="date" />
            </div>
            <div class="campo-grupo">
              <label class="campo-rotulo">Tipo</label>
              <select class="campo-entrada" id="campo-tipo">
                <option value="entrevista">Entrevista</option>
                <option value="prazo">Prazo</option>
                <option value="teste">Teste Técnico</option>
                <option value="resultado">Resultado</option>
                <option value="inicio">Início de Estágio</option>
                <option value="outro">Outro</option>
              </select>
            </div>
          </div>
          <div class="campo-linha">
            <div class="campo-grupo">
              <label class="campo-rotulo">Hora início</label>
              <input
                class="campo-entrada"
                id="campo-hora-inicio"
                type="time"
                value="09:00"
              />
            </div>
            <div class="campo-grupo">
              <label class="campo-rotulo">Hora fim</label>
              <input
                class="campo-entrada"
                id="campo-hora-fim"
                type="time"
                value="10:00"
              />
            </div>
          </div>
          <div class="campo-grupo">
            <label class="campo-rotulo">Modalidade</label>
            <select class="campo-entrada" id="campo-modalidade">
              <option value="Online">Online</option>
              <option value="Presencial">Presencial</option>
              <option value="Remoto">Remoto</option>
            </select>
          </div>
          <div class="campo-grupo">
            <label class="campo-rotulo">Descrição</label>
            <textarea
              class="campo-area"
              id="campo-descricao"
              placeholder="Detalhes do evento..."
            ></textarea>
          </div>
        </div>
        <div class="modal-rodape">
          <button class="btn-cancelar" id="btn-cancelar">Cancelar</button>
          <button class="btn-salvar" id="btn-salvar">Salvar evento</button>
        </div>
      </div>
    </div>

    <!-- POPUP – DETALHE DO EVENTO -->
    <div class="popup-evento" id="popup-evento">
      <div class="popup-barra-cor" id="popup-barra-cor"></div>
      <div class="popup-corpo">
        <div class="popup-titulo" id="popup-titulo"></div>
        <div class="popup-info">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span id="popup-data"></span>
        </div>
        <div class="popup-info">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span id="popup-hora"></span>
        </div>
        <div class="popup-info" id="popup-modalidade-linha">
          <svg viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <span id="popup-modalidade"></span>
        </div>
        <div class="popup-descricao" id="popup-descricao"></div>
      </div>
      <div class="popup-acoes">
        <button class="popup-btn" id="popup-btn-editar">Editar</button>
        <button class="popup-btn vermelho" id="popup-btn-excluir">
          Excluir
        </button>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="./../../assets/js/auth.js"></script>
  </body>
</html>
