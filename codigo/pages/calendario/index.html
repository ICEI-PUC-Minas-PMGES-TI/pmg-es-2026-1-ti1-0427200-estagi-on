<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="calendario.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sb-logo">
          <img
            src="../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </div>

        <nav class="sb-body">
          <div class="sb-section-label">Principal</div>

          <a href="../../index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <span class="sb-item-label">Dashboard</span>

          <a href="../../pages/mensagens/index.html" class="sb-item">
            <div class="sb-item-icon">

                />
              </svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
          </a>

          <a href="../../pages/calendario/index.html" class="sb-item active">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />

                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>
            <span class="sb-item-label">Calendário</span>
          </a>

          <a href="../../pages/listagem-vagas/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 22V12a8 8 0 0 1 16 0v10" />
                <line x1="2" y1="22" x2="22" y2="22" />
                <path d="M10 22v-4a2 2 0 1 1 4 0v4" />
              </svg>
            </div>
            <span class="sb-item-label">Vagas</span>
          </a>

          <div class="sb-divider"></div>
          <div class="sb-section-label">Conta</div>

          <a href="#" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
          </a>
        </nav>
        <a href="../../pages/login/index.html" class="sb-footer">
          <div class="sb-user-av">AM</div>
          <div class="sb-user-info">
            <div class="sb-user-name">Ana Martins</div>
            <div class="sb-user-role">Aluna · USP</div>
          </div>
          <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </div>
        </a>
      </aside>
      <div class="main-content">
        <header class="topbar">
          <div class="tb-page">
            <span class="tb-page-title">Calendário</span>
            <!-- <span class="tb-page-sub">Entrevistas, prazos e eventos</span> -->
          </div>

          <div class="tb-sep"></div>

          <div class="tb-view-switcher">
            <input
              type="radio"
              name="tb-view"
              id="view-mes"
              class="tb-view-radio"
              checked
            />
            <label class="tb-view-btn" for="view-mes">Mês</label>

            <input
              type="radio"
              name="tb-view"
              id="view-semana"
              class="tb-view-radio"
            />
            <label class="tb-view-btn" for="view-semana">Semana</label>

            <input
              type="radio"
              name="tb-view"
              id="view-dia"
              class="tb-view-radio"
            />
            <label class="tb-view-btn" for="view-dia">Dia</label>

            <input
              type="radio"
              name="tb-view"
              id="view-agenda"
              class="tb-view-radio"
            />
            <label class="tb-view-btn" for="view-agenda">Agenda</label>
          </div>

          <!-- <button class="tb-today-btn">Hoje</button> -->

          <div class="tb-flex"></div>

      <div class="tb-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar evento..." />
      </div> -->

          <button class="tb-add-btn">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Novo evento
          </button>

          <div class="tb-user">
            <span class="tb-user-name">Ana Martins</span>
            <div class="tb-user-av">AM</div>
          </div>
        </header>
