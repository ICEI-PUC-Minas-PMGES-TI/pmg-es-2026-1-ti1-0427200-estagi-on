<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
    <title>Vagas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="layout">

<aside class="sidebar">
        <div class="sb-logo">
        <div class="sb-logo-mark">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 2L18 7V13L10 18L2 13V7L10 2Z" fill="white" opacity="0.9"/>
            <path d="M10 6L14 8.5V13L10 15.5L6 13V8.5L10 6Z" fill="#0F2D52"/>
        </svg>
        </div>
        <span class="sb-logo-name">Estagi.ON</span>
    </div>

    <nav class="sb-body">

        <div class="sb-section-label">Principal</div>

        <input type="radio" name="sb-nav" id="nav-dashboard" class="sb-radio" />
        <label class="sb-item" for="nav-dashboard">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <span class="sb-item-label">Dashboard</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-mensagens" class="sb-radio" />
        <label class="sb-item" for="nav-mensagens">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span class="sb-item-label">Mensagens</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-calendario" class="sb-radio" checked />
        <label class="sb-item" for="nav-calendario">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span class="sb-item-label">Calendário</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-vagas" class="sb-radio" />
        <label class="sb-item" for="nav-vagas">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><path d="M4 22V12a8 8 0 0 1 16 0v10"/><line x1="2" y1="22" x2="22" y2="22"/><path d="M10 22v-4a2 2 0 1 1 4 0v4"/></svg>
        </div>
        <span class="sb-item-label">Vagas</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-candidaturas" class="sb-radio" />
        <label class="sb-item" for="nav-candidaturas">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
        </div>
        <span class="sb-item-label">Candidaturas</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-noticias" class="sb-radio" />
        <label class="sb-item" for="nav-noticias">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h8M4 18h16"/></svg>
        </div>
        <span class="sb-item-label">Notícias</span>
        </label>

        <div class="sb-divider"></div>
        <div class="sb-section-label">Conta</div>

        <input type="radio" name="sb-nav" id="nav-perfil" class="sb-radio" />
        <label class="sb-item" for="nav-perfil">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="sb-item-label">Meu Perfil</span>
        </label>

        <input type="radio" name="sb-nav" id="nav-config" class="sb-radio" />
        <label class="sb-item" for="nav-config">
        <div class="sb-item-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <span class="sb-item-label">Configurações</span>
    </label>

    </nav>

    <div class="sb-footer">
    <div class="sb-user-av">AM</div>
    <div class="sb-user-info">
        <div class="sb-user-name">Ana Martins</div>
        <div class="sb-user-role">Aluna · USP</div>
    </div>
    <div class="sb-logout-icon">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    </div>
</aside>


<main class="main-content">
<div class="container">

    <h1 class="titulo-vagas">VAGAS</h1>

    <!-- BUSCA -->
    <div class="topo">
        <input type="text" id="busca" placeholder=" Buscar vagas">
    </div>

    <!-- CARDS -->
    <div class="cards-topo">
        <div class="card">Vagas salvas</div>
        <div class="card">Situação das vagas</div>
    </div>

    <div class="conteudo">

        <!-- FILTROS -->
        <div class="filtros">
        <div class="dropdown">
            <button class="dropdown-btn" onclick="toggleMenu(this)">
                Cargo ▼
            </button>
            
            <div  class="dropdown-content">
                <a href="#" onclick="selecionarArea('Desenvolvedor')">Desenvolvedor</a>
                <a href="#" onclick="selecionarArea('RH')"> RH</a>
                <a href="#" onclick="selecionarArea('Designer')">Designer</a>
            </div>
            </div>
            <div class="dropdown">
            <button class="dropdown-btn" onclick="toggleMenu(this)">
                Cidade ▼
            </button>
            <div  class="dropdown-content">
                <a href="#" onclick="selecionarCidade('Contagem')">Contagem</a>
                <a href="#" onclick="selecionarCidade('Betim')">Betim</a>
                <a href="#" onclick="selecionarCidade('Belo Horizonte')">Belo Horizonte</a>
            </div>
        </div>
            <button id="aplicar">Aplicar filtros</button>
            <button id="limpar" class="limpar">Limpar filtros</button>
        </div>

        <!-- LISTA -->
        <div class="lista" id="listaVagas">
            <h3>Lista de vagas</h3>
        </div>

    </div>

</div>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
