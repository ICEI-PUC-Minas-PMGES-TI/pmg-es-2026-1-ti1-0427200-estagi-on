<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estagi.ON - Mensagens</title>

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header
      class="app-header"
      style="
        background-color: var(--color-surface);
        padding: 1rem 2rem;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      "
    >
      <a href="../../index.html" style="text-decoration: none">
        <img
          src="../../assets/images/Logo.png"
          alt="Logo Estagi.ON"
          style="height: 40px; width: auto"
        />
      </a>
      <nav style="display: flex; align-items: center; gap: 2rem">
        <a
          href="../../pages/login/index.html"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            text-decoration: none;
            font-size: 1rem;
          "
          >🔐 Login</a
        >
        <a
          href="#"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            text-decoration: none;
            font-size: 1rem;
          "
          >👤 Perfil</a
        >
        <button
          onclick="window.history.back()"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
          "
        >
          ⬅ Voltar
        </button>
      </nav>
    </header>

    <div class="messaging-container">
      <aside class="contacts-sidebar">
        <div class="contacts-header">
          <h3>Conversas</h3>
          <input
            type="text"
            id="search-contacts"
            placeholder="Buscar..."
            class="search-input"
          />
        </div>
        <ul id="contacts-list" class="contacts-list"></ul>
      </aside>

      <section class="chat-section">
        <header class="chat-header">
          <div>
            <h2 id="contact-name">Selecione uma conversa</h2>
            <p id="contact-type" class="contact-type"></p>
          </div>
        </header>

        <main id="chat-box" class="chat-box">
          <div class="empty-state">
            <p>Selecione uma conversa para começar a trocar mensagens</p>
          </div>
        </main>

        <footer class="chat-footer">
          <input
            type="text"
            id="message-input"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            disabled
          />
          <button id="send-button" disabled>Enviar</button>
        </footer>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
