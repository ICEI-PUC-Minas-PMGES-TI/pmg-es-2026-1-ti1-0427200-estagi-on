<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estagi.ON - Mensagens</title>

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header
      class="app-header"
      style="
        background-color: var(--color-surface);
        padding: 1rem 2rem;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      "
    >
      <a href="../../index.html" style="text-decoration: none">
        <img
          src="../../assets/images/Logo.png"
          alt="Logo Estagi.ON"
          style="height: 40px; width: auto"
        />
      </a>
      <nav style="display: flex; align-items: center; gap: 2rem">
        <a
          href="../../pages/login/index.html"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            text-decoration: none;
            font-size: 1rem;
          "
          >🔐 Login</a
        >
        <a
          href="#"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            text-decoration: none;
            font-size: 1rem;
          "
          >👤 Perfil</a
        >
        <button
          onclick="window.history.back()"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-main);
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
          "
        >
          ⬅ Voltar
        </button>
      </nav>
    </header>

    <div class="chat-container">
      <header class="chat-header">
        <h2 id="contact-name">Recrutador / Empresa</h2>
      </header>

      <main id="chat-box" class="chat-box"></main>

      <footer class="chat-footer">
        <input
          type="text"
          id="message-input"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        />
        <button id="send-button">Enviar</button>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
