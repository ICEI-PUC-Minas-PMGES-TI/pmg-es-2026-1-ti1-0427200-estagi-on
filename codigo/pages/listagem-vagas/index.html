<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <title>Vagas</title>
    <link rel="stylesheet" href="estilo.css" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sb-logo">
          <img
            src="./../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </div>

        <nav class="sb-body">
          <div class="sb-section-label">Principal</div>

          <a href="./../../index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
          </a>

          <a href="./../../pages/mensagens/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
          </a>

          <a href="./../../pages/calendario/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>
            <span class="sb-item-label">Calendário</span>
          </a>

          <a href="./../../pages/listagem-vagas/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 22V12a8 8 0 0 1 16 0v10" />
                <line x1="2" y1="22" x2="22" y2="22" />
                <path d="M10 22v-4a2 2 0 1 1 4 0v4" />
              </svg>
            </div>
            <span class="sb-item-label">Vagas</span>
          </a>

          <div class="sb-divider"></div>
          <div class="sb-section-label">Conta</div>

          <a href="./../../pages/perfil/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
          </a>
        </nav>

        <a href="./../../pages/login/index.html" class="sb-footer">
          <div class="sb-user-av" id="sb-avatar">??</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="sb-nome">Visitante</div>
            <div class="sb-user-role" id="sb-tipo">---</div>
          </div>
          <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </div>
        </a>
      </aside>
      
      <div class="main-content">
        <main class="container">
          <div class="container-vagas">
            <h1>VAGAS</h1>

            <!-- BUSCA -->
            <div class="topo">
              <input type="text" id="busca" placeholder=" Buscar vagas" />
            </div>

            <!-- CARDS -->
            <div class="cards-topo">
              <div class="card">Vagas salvas</div>
              <div class="card">Situação das vagas</div>
            </div>

            <div class="conteudo">
              <!-- FILTROS ADAPTADOS ÀS 7 VAGAS -->
              <div class="filtros">
                
                <!-- Cargo / Área -->
                <div class="dropdown">
                  <button class="dropdown-btn" onclick="toggleMenu(this)">
                    Cargo ▼
                  </button>
                  <div class="dropdown-content">
                    <a href="#" data-area="Desenvolvedor" onclick="selecionarArea('Desenvolvedor')">Desenvolvedor</a>
                    <a href="#" data-area="Dados" onclick="selecionarArea('Dados')">Dados</a>
                    <a href="#" data-area="Design" onclick="selecionarArea('Design')">Designer</a>
                    <a href="#" data-area="RH" onclick="selecionarArea('RH')">RH</a>
                  </div>
                </div>
                
                <!-- Cidade / Local -->
                <div class="dropdown">
                  <button class="dropdown-btn" onclick="toggleMenu(this)">
                    Cidade ▼
                  </button>
                  <div class="dropdown-content">
                    <a href="#" data-cidade="Belo Horizonte - MG" onclick="selecionarCidade('Belo Horizonte - MG')">Belo Horizonte</a>
                    <a href="#" data-cidade="Betim - MG" onclick="selecionarCidade('Betim - MG')">Betim</a>
                    <a href="#" data-cidade="Contagem - MG" onclick="selecionarCidade('Contagem - MG')">Contagem</a>
                    <a href="#" data-cidade="São Paulo - SP" onclick="selecionarCidade('São Paulo - SP')">São Paulo</a>
                    <a href="#" data-cidade="Remoto" onclick="selecionarCidade('Remoto')">Remoto (Sem Cidade)</a>
                  </div>
                </div>
                
                <!-- Modalidade -->
                <div class="dropdown">
                  <button class="dropdown-btn" onclick="toggleMenu(this)">
                    Modalidade ▼
                  </button>
                  <div class="dropdown-content">
                    <a href="#" data-modalidade="Remoto" onclick="selecionarModalidade('Remoto')">Remoto</a>
                    <a href="#" data-modalidade="Presencial" onclick="selecionarModalidade('Presencial')">Presencial</a>
                    <a href="#" data-modalidade="Híbrido" onclick="selecionarModalidade('Híbrido')">Híbrido</a>
                  </div>
                </div>
                
                <!-- Botão Limpar -->
                <button id="limpar" class="limpar">Limpar filtros</button>
              </div>

              <!-- LISTA -->
              <div class="lista" id="listaVagas">
                <h3>Lista de vagas</h3>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    
    <script src="script.js"></script>
    <script src="./../../assets/js/auth.js"></script>
  </body>
</html>
