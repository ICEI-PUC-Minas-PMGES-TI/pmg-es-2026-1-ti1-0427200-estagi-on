<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes da Vaga - Estagi.ON</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <script src="../../assets/js/login.js"></script>
  <style>
    .vaga-card {
      max-width: 760px;
      margin: 30px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .vaga-card h1 { color: #093070; margin-bottom: 4px; }
    .vaga-empresa { color: #ff7645; font-weight: bold; font-size: 1.1em; margin-bottom: 16px; }
    .vaga-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .vaga-meta span { background: #f0f4ff; border-radius: 6px; padding: 4px 12px; font-size: 0.9em; color: #093070; }
    .vaga-bolsa { font-size: 1.3em; font-weight: bold; color: #198754; margin-bottom: 20px; }
    .vaga-secao { margin-bottom: 18px; }
    .vaga-secao h3 { font-size: 1em; color: #093070; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 8px; }
    .requisitos-lista { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
    .requisitos-lista li { background: #fff3ee; border: 1px solid #ff7645; border-radius: 20px; padding: 3px 12px; font-size: 0.88em; color: #ff7645; }
    .acoes { display: flex; gap: 12px; margin-top: 24px; }
    #msg-feedback { margin-top: 14px; font-weight: bold; display: none; }
    #loading { text-align: center; padding: 40px; color: #888; }
    #erro { text-align: center; padding: 40px; color: #dc3545; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="banner"><img src="../../assets/images/banner_ti.png" alt="Estagi.ON" /></div>
    <div class="barra-info">
      <nav class="menu">
        <ul>
          <li><a href="../../index.html">Home</a></li>
          <li><a href="../../about.html">Sobre nós</a></li>
        </ul>
      </nav>
      <div class="dados-usuario"><span id="userInfo"></span></div>
    </div>
  </header>

  <main>
    <div id="loading">Carregando vaga...</div>
    <div id="erro">Vaga não encontrada.</div>

    <div class="vaga-card" id="vaga-container" style="display:none;">
      <h1 id="vaga-titulo"></h1>
      <div class="vaga-empresa" id="vaga-empresa"></div>

      <div class="vaga-meta">
        <span id="vaga-local">📍</span>
        <span id="vaga-modalidade">🏠</span>
        <span id="vaga-carga">🕐</span>
      </div>

      <div class="vaga-bolsa" id="vaga-bolsa"></div>

      <div class="vaga-secao">
        <h3>Descrição</h3>
        <p id="vaga-descricao"></p>
      </div>

      <div class="vaga-secao">
        <h3>Requisitos</h3>
        <ul class="requisitos-lista" id="vaga-requisitos"></ul>
      </div>

      <div class="acoes">
        <button class="btn btn-primary" onclick="demonstrarInteresse()">✅ Tenho interesse</button>
        <button class="btn btn-outline-danger" onclick="denunciarVaga()">🚩 Denunciar vaga</button>
      </div>

      <div id="msg-feedback"></div>
    </div>
  </main>

  <script src="detalhes-vaga.js"></script>
</body>
</html>
