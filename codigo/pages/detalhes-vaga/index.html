<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes da Vaga - Estagi.ON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
<div class="app-layout">
<aside class="sidebar">
        <div class="sb-logo">
          <img
            src="./../../assets/images/Logo.png"
            alt="Logo Estagi.ON"
            style="height: 50px; width: auto"
          />
        </div>

        <nav class="sb-body">
          <div class="sb-section-label">Principal</div>

          <a href="./../../index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </div>
            <span class="sb-item-label">Dashboard</span>
          </a>

          <a href="./../../pages/mensagens/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
            </div>
            <span class="sb-item-label">Mensagens</span>
          </a>

          <a href="./../../pages/calendario/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>
            <span class="sb-item-label">Calendário</span>
          </a>

          <a href="./../../pages/listagem-vagas/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 22V12a8 8 0 0 1 16 0v10" />
                <line x1="2" y1="22" x2="22" y2="22" />
                <path d="M10 22v-4a2 2 0 1 1 4 0v4" />
              </svg>
            </div>
            <span class="sb-item-label">Vagas</span>
          </a>

          <div class="sb-divider"></div>
          <div class="sb-section-label">Conta</div>

          <a href="./../../pages/perfil/index.html" class="sb-item">
            <div class="sb-item-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span class="sb-item-label">Meu Perfil</span>
          </a>
        </nav>

        <a href="./../../pages/login/index.html" class="sb-footer">
          <div class="sb-user-av" id="sb-avatar">??</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="sb-nome">Visitante</div>
            <div class="sb-user-role" id="sb-tipo">---</div>
          </div>
          <div class="sb-logout-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </div>
        </a>
      </aside>
<div class="main-content">
<main class="container">
      <div id="loading">Carregando vaga...</div>
      <div id="erro">Vaga não encontrada.</div>

      <div class="vaga-card" id="vaga-container" style="display: none">
        <div id="toast-favorito" class="toast-favorito"></div>
        <button class="btn-favoritar" id="btn-favoritar" onclick="toggleFavorito()" title="Favoritar vaga">
          <svg id="icone-coracao" viewBox="0 0 24 24" width="24" height="24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <a href="../../pages/listagem-vagas/index.html" class="voltar">← Voltar para vagas</a>
        <h1 id="vaga-titulo"></h1>
        <div class="vaga-empresa" id="vaga-empresa"></div>

        <div class="vaga-meta">
          <span id="vaga-local">📍</span>
          <span id="vaga-modalidade">🏠</span>
          <span id="vaga-carga">🕐</span>
        </div>

        <div class="vaga-bolsa" id="vaga-bolsa"></div>

        <div class="vaga-secao">
          <h3>Descrição</h3>
          <p id="vaga-descricao"></p>
        </div>

        <div class="vaga-secao">
          <h3>Requisitos</h3>
          <ul class="requisitos-lista" id="vaga-requisitos"></ul>
        </div>

        <div class="vaga-secao">
          <h3>Contato</h3>
          <p id="vaga-contato"></p>
        </div>

        <div class="acoes">
          <button class="btn-interesse" id="btn-interesse" onclick="demonstrarInteresse()">Tenho interesse</button>
          <button class="btn-curriculo" id="btn-curriculo" onclick="acaoCurriculo()">📄 Anexar Currículo</button>
          <input type="file" id="input-curriculo-vaga" accept=".pdf,.doc,.docx" style="display:none" />
        </div>

        <div id="msg-feedback" style="display:none"></div>
      </div>
    </main>

    <script src="script.js"></script>
</div>
</div>
  <script src="./../../assets/js/auth.js"></script>
  </body>
</html>
